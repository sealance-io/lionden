# zizmor configuration
# https://docs.zizmor.sh/configuration/
#
# All audits stay enabled. The only exception is a scoped, documented ignore below.
rules:
  # The publish workflow intentionally retains a scoped GitHub App token on checkout so
  # `git push --follow-tags` can publish release tags. It uploads no artifacts, so the
  # artipacked (credentials-leak-via-artifact) risk does not apply. Pinning and minimal
  # per-job permissions are still enforced everywhere.
  artipacked:
    ignore:
      - release-publish.yml
