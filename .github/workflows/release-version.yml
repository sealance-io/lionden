name: Release - Version

on:
  push:
    branches:
      - main
  workflow_dispatch:

# No default permissions — every job requests only what it needs.
permissions: {}

# Never cancel an in-flight versioning run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Opens/updates the "Version Packages" PR from accumulated changesets. Uses a GitHub App
  # token so merging that PR can trigger release-publish.yml (the default GITHUB_TOKEN can't
  # trigger downstream workflows). No-op when there are no changesets.
  version:
    # Explicit main-only guard, evaluated before the environment gate and before any App token
    # is minted. The release-automation environment's deployment-branch policy (main only) is
    # the second layer; this keeps a workflow_dispatch from another ref from opening a Version
    # Packages PR even if that policy is ever loosened.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-automation
    permissions:
      contents: read # App token performs the writes
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SEALANCE_PUBLIC_SIGNER_APP_ID }}
          private-key: ${{ secrets.SEALANCE_PUBLIC_SIGNER_APP_PRIVATE_KEY }}
          repositories: lionden
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # changesets/action pushes through the GitHub API
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # never cache in privileged release builds
      - run: npm run lint:lockfile
      - run: npm run test:release-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund --allow-git=none
      - run: npm run test:version-packages
      - name: Create or update the Version Packages PR
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: npm run version-packages
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
