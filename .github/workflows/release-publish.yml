name: Release - Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

# No default permissions — every job requests only what it needs.
permissions: {}

# Never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Gate: only publish when this push is the merge of the changesets "Version Packages" PR
  # (branch changeset-release/main). A manual dispatch from main is metadata-only: it must never
  # publish whatever package versions happen to be checked out before a Version Packages PR.
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      should_publish_npm: ${{ steps.check.outputs.should_publish_npm }}
    steps:
      - name: Determine release mode
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/heads/main') {
                core.warning(`Manual dispatch on ${context.ref} — refusing to run from a non-main ref`);
                core.setOutput('should_run', 'false');
                core.setOutput('should_publish_npm', 'false');
                return;
              }
              core.info('Manual dispatch from main — reconciling tags and Releases without publishing');
              core.setOutput('should_run', 'true');
              core.setOutput('should_publish_npm', 'false');
              return;
            }
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
            // The branch name alone is not proof: a fork can reuse it. Require a merged PR from
            // this repository's changeset-release/main into this repository's main whose merge
            // commit is exactly the pushed commit (merge_commit_sha is the merge commit, the
            // squash commit, or the last rebased commit — the new tip in every case).
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const checks = (pr) => ({
              merged: Boolean(pr.merged_at),
              headRef: pr.head.ref === 'changeset-release/main',
              headRepo: pr.head.repo?.full_name === repo,
              baseRef: pr.base.ref === 'main',
              baseRepo: pr.base.repo?.full_name === repo,
              mergeCommit: pr.merge_commit_sha === context.sha,
            });
            let releasePr;
            for (const pr of prs) {
              const result = checks(pr);
              const failed = Object.entries(result).filter(([, ok]) => !ok).map(([k]) => k);
              if (failed.length === 0) {
                releasePr = pr;
                break;
              }
              if (result.headRef) {
                core.warning(`PR #${pr.number} looks like a release PR but fails: ${failed.join(', ')}`);
              }
            }
            core.info(
              releasePr
                ? `Release PR #${releasePr.number} merged as ${context.sha} — publishing`
                : 'Not a verified release-PR merge — skipping release work',
            );
            core.setOutput('should_run', releasePr ? 'true' : 'false');
            core.setOutput('should_publish_npm', releasePr ? 'true' : 'false');

  publish-npm:
    needs: check-release
    # Defense-in-depth: never perform release work from anything but main, regardless of the gate.
    if: needs.check-release.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish # protected: required reviewers, main-only
    permissions:
      contents: write # push tags + create GitHub Releases
      id-token: write # npm OIDC trusted publishing
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SEALANCE_PUBLIC_SIGNER_APP_ID }}
          private-key: ${{ secrets.SEALANCE_PUBLIC_SIGNER_APP_PRIVATE_KEY }}
          repositories: lionden
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }} # creds retained → tag push works
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org" # OIDC; no NODE_AUTH_TOKEN
          package-manager-cache: false # never cache in privileged release builds
      - run: npm run lint:lockfile
      - run: npm run test:release-scripts
      - if: needs.check-release.outputs.should_publish_npm == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --allow-git=none
      - name: Validate the release state about to be published
        # Publishing path only: the metadata-only dispatch must keep working while main carries
        # historical skew or pending changesets. The base is main's tip before this push
        # (github.event.before), which still holds the pending changesets under merge-commit,
        # squash, and multi-commit rebase merges alike; HEAD^1 would already be versioned after
        # a multi-commit rebase.
        if: needs.check-release.outputs.should_publish_npm == 'true'
        run: npm run validate:release-state -- --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.before }}
      - if: needs.check-release.outputs.should_publish_npm == 'true'
        run: npm run build
      - name: Publish (all bumped packages, idempotent)
        if: needs.check-release.outputs.should_publish_npm == 'true'
        run: npx changeset publish
        env:
          # Provenance only when the source repo is public (npm can't attest a private repo);
          # auto-flips on going OSS, off while internal so publish doesn't fail.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
      - name: Reconcile and verify release tags
        # Enumerate every published version of the fixed public package group. Missing tags are
        # recreated at npm's immutable gitHead, so a rerun repairs both the current release and
        # historical versions whose npm publish succeeded without metadata reaching GitHub.
        run: >-
          node scripts/reconcile-release-tags.mjs
          --push
          --output "$RUNNER_TEMP/release-tags.txt"
      - name: Create or verify per-package GitHub Releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAGS_FILE: ${{ runner.temp }}/release-tags.txt
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const tags = fs
              .readFileSync(process.env.RELEASE_TAGS_FILE, 'utf8')
              .split('\n')
              .map((s) => s.trim())
              .filter(Boolean);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existingTags = new Set(releases.map((release) => release.tag_name));
            const missingTags = tags.filter((tag) => !existingTags.has(tag));
            for (const tag of missingTags) {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: false,
              });
              core.info(`Created release ${tag}`);
            }
            core.info(`Verified ${tags.length} release tags; created ${missingTags.length} Releases`);

  # Rollup sentinel: stable status for the release pipeline.
  release-status:
    name: Release Status
    needs: [check-release, publish-npm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Check results
        run: |
          echo "::group::Job results"
          echo "should_run: $SHOULD_RUN"
          echo "should_publish_npm: $SHOULD_PUBLISH_NPM"
          echo "release job result: $RELEASE_RESULT"
          echo "::endgroup::"

          if [[ "$SHOULD_RUN" != "true" ]]; then
            echo "::notice::Not a release — release work skipped"
            exit 0
          fi
          if [[ "$RELEASE_RESULT" != "success" ]]; then
            echo "::error::Release work failed or was cancelled"
            exit 1
          fi
          if [[ "$SHOULD_PUBLISH_NPM" == "true" ]]; then
            echo "::notice::Release published and metadata reconciled"
          else
            echo "::notice::Release metadata reconciled without npm publication"
          fi
        env:
          SHOULD_RUN: ${{ needs.check-release.outputs.should_run }}
          SHOULD_PUBLISH_NPM: ${{ needs.check-release.outputs.should_publish_npm }}
          RELEASE_RESULT: ${{ needs.publish-npm.result }}
